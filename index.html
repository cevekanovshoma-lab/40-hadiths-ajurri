<!DOCTYPE html>
<html lang="ru" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Сорок Хадисов - Имам аль-Аджурри</title>
    
    <!-- Настройки для PWA (иконки и мобильный вид) -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="40 Хадисов">
    
    <!-- Принудительное обновление иконки (добавлен ?v=2) -->
    <link rel="apple-touch-icon" href="image_2.png?v=2">
    <meta name="mobile-web-app-capable" content="yes">
    <link rel="icon" type="image/png" href="image_2.png?v=2">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        .arabic-text { font-family: 'Amiri', serif; }
        body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        
        /* Золотисто-коричневый цвет для рамки номера */
        .gold-badge {
            background-color: #c0a16b;
            color: white;
            border: 2px solid #a88a53;
        }

</head>
<body class="bg-slate-100 text-slate-800 min-h-screen flex flex-col justify-between selection:bg-[#c0a16b] selection:text-white">

    <!-- Шапка приложения -->
    <header class="bg-emerald-800 text-white shadow-lg sticky top-0 z-20">
        <div class="max-w-md mx-auto px-4 py-3.5 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <button onclick="toggleSidebar()" class="p-1.5 rounded-lg hover:bg-emerald-700 transition" aria-label="Список хадисов">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
                    </svg>
                </button>
                <div>
                    <h1 class="text-base font-bold tracking-wide leading-tight">Сорок Хадисов</h1>
                    <p class="text-[11px] text-emerald-200">Имам аль-Аджурри</p>
                </div>
            </div>
            <div class="flex items-center space-x-2">
                <span class="text-xs bg-emerald-900/80 px-2.5 py-1 rounded-full font-medium border border-emerald-700" id="counter">1 / 40</span>
                <button onclick="toggleBookmarksList()" class="p-1.5 rounded-lg hover:bg-emerald-700 transition relative" aria-label="Закладки">
                    <svg class="w-5 h-5 text-amber-300" fill="currentColor" viewBox="0 0 24 24">
                        <path d="M5 5a2 2 0 012-2h10a2 2 0 012 2v16l-7-3.5L5 21V5z"/>
                    </svg>
                </button>
            </div>
        </div>
    </header>

    <!-- Боковое меню (Содержание и Поиск) -->
    <div id="sidebar" class="fixed inset-0 z-50 bg-black/50 backdrop-blur-sm hidden transition-opacity opacity-0 pointer-events-none">
        <div class="absolute left-0 top-0 bottom-0 w-[85%] max-w-sm bg-white shadow-2xl flex flex-col transform -translate-x-full transition-transform duration-300" id="sidebar-content">
            <div class="p-4 bg-emerald-800 text-white flex justify-between items-center border-b border-emerald-900">
                <h2 class="font-bold text-lg">Содержание</h2>
                <button onclick="toggleSidebar()" class="p-1 rounded-lg hover:bg-emerald-700 transition">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                    </svg>
                </button>
            </div>
            <div class="p-3 border-b bg-slate-50">
                <input type="text" id="search-input" oninput="filterHadiths(this.value)" placeholder="Поиск по тексту или номеру..." class="w-full px-4 py-2.5 text-sm bg-white border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-[#c0a16b]">
            </div>
            <div class="flex-1 overflow-y-auto divide-y divide-slate-100" id="hadiths-list-container">
                <!-- Динамически заполняемый список -->
            </div>
        </div>
    </div>

    <!-- Модальное окно избранного -->
    <div id="bookmarks-modal" class="fixed inset-0 z-50 bg-black/50 backdrop-blur-sm hidden items-center justify-center p-4">
        <div class="bg-white rounded-2xl w-full max-w-md max-h-[80vh] flex flex-col shadow-2xl overflow-hidden">
            <div class="p-4 bg-emerald-800 text-white flex justify-between items-center">
                <h2 class="font-bold text-base">Избранные хадисы</h2>
                <button onclick="toggleBookmarksList()" class="p-1 rounded-lg hover:bg-emerald-700 transition">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                    </svg>
                </button>
            </div>
            <div class="flex-1 overflow-y-auto p-4 space-y-2.5" id="bookmarks-container">
                <!-- Закладки -->
            </div>
        </div>
    </div>

    <!-- Основной контент (Карточка хадиса) -->
    <main class="flex-1 max-w-md w-full mx-auto p-3.5 sm:p-4 flex flex-col justify-between my-auto">
        <div class="bg-white rounded-3xl shadow-sm border border-slate-200/80 p-5 sm:p-6 flex-1 flex flex-col justify-between relative overflow-hidden">
            
            <div class="space-y-5 relative z-10">
                <!-- Верхняя панель карточки: Номер (Золотистый) и Закладка -->
                <div class="flex items-center justify-between border-b border-slate-100 pb-3">
                    <span class="text-xs font-bold uppercase tracking-wider gold-badge px-3.5 py-1.5 rounded-full shadow-sm">
                        Хадис № <span id="hadith-num">1</span>
                    </span>
                    <button onclick="toggleBookmarkCurrent()" id="bookmark-btn" class="text-slate-400 hover:text-amber-500 transition p-1.5 rounded-full hover:bg-slate-50" title="В закладки">
                        <svg class="w-7 h-7" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" id="bookmark-icon">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M5 5a2 2 0 012-2h10a2 2 0 012 2v16l-7-3.5L5 21V5z"/>
                        </svg>
                    </button>
                </div>

                <!-- Текст на арабском -->
                <div>
                    <div class="flex justify-between items-center mb-1.5">
                        <span class="text-[11px] font-bold uppercase tracking-wider text-slate-400">Арабский текст</span>
                        <button onclick="copyArabic()" class="text-xs text-[#c0a16b] hover:underline font-medium">Копировать</button>
                    </div>
                    <div class="bg-slate-50/80 p-4 sm:p-5 rounded-2xl border border-slate-100">
                        <p class="arabic-text text-2xl sm:text-3xl leading-loose text-right text-slate-900" id="arabic-text" dir="rtl"></p>
                    </div>
                </div>

                <!-- Перевод на русский -->
                <div>
                    <div class="flex justify-between items-center mb-1.5">
                        <span class="text-[11px] font-bold uppercase tracking-wider text-slate-400">Перевод</span>
                        <button onclick="copyRussian()" class="text-xs text-[#c0a16b] hover:underline font-medium">Копировать</button>
                    </div>
                    <p class="text-slate-800 text-sm sm:text-base leading-relaxed font-normal" id="russian-text"></p>
                </div>

                <!-- Объяснение / Польза -->
                <div class="bg-amber-50/70 border border-amber-200/60 rounded-2xl p-4">
                    <h3 class="text-xs font-bold uppercase tracking-wider text-[#c0a16b] mb-1.5 flex items-center space-x-1">
                        <svg class="w-4 h-4 mr-1 text-[#c0a16b] inline" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path></svg>
                        <span>Польза и разъяснение</span>
                    </h3>
                    <p class="text-amber-950/90 text-xs sm:text-sm leading-relaxed" id="explanation-text"></p>
                </div>
            </div>

            <!-- Нижняя навигация -->
            <div class="flex gap-3 mt-8 pt-4 border-t border-slate-100 relative z-10">
                <button onclick="prevHadith()" id="prev-btn" class="flex-1 bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium py-3 px-4 rounded-xl transition text-sm disabled:opacity-30 disabled:cursor-not-allowed flex items-center justify-center space-x-1.5">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
                    <span>Назад</span>
                </button>
                <button onclick="nextHadith()" id="next-btn" class="flex-1 gold-badge hover:brightness-110 font-medium py-3 px-4 rounded-xl transition text-sm flex items-center justify-center space-x-1.5 border-none">
                    <span>Вперед</span>
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
                </button>
            </div>
        </div>
    </main>

    <!-- Уведомления -->
    <div id="toast" class="fixed bottom-20 left-1/2 transform -translate-x-1/2 bg-slate-900 text-white px-4 py-2.5 rounded-xl text-xs font-medium shadow-xl opacity-0 pointer-events-none transition-opacity duration-300 z-50">
        Текст скопирован
    </div>

    <script>
        // ПОЛНАЯ БАЗА ИЗ 40 ХАДИСОВ
        const hadiths = [
            {
                id: 1,
                arabic: "عَنْ أَبِي هُرَيْرَةَ قَالَ: قَالَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ: مَنْ يُرِدِ اللَّهُ بِهِ خَيْرًا يُفَقِّهْهُ فِي الدِّينِ",
                russian: "От Абу Хурайры, который сказал: Сказал Посланник Аллаха: «Кому Аллах желает блага, даёт понимание в Веровании».",
                explanation: "Этот хадис указывает на то, что тот, кто не обрёл правильное понимание в своём веровании (не изучает основы религии, обязательные знания об омовении, молитве и т.д.), в том нет блага. Стремление к знаниям — обязанность каждого мусульманина."
            },
            {
                id: 2,
                arabic: "عَنْ أَبِي أُمَامَةَ الْبَاهِلِي: رَضِيَ اللَّهُ عَنْهُ أَنَّ رَسُولَ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ قَالَ: عَلَيْكُمْ بِالْعِلْمِ قَبْلَ أَنْ يُقْبَضَ: وَقَبْلَ أَنْ يُرْفَعَ... الْعَالِمُ وَالْمُتَعَلِّّمُ شَرِيكَانِ فِي الْأَجْرِ",
                russian: "От Абу Умамы аль-Бахили, что Посланник Аллаха сказал: «Вам следует получать знания, пока оно не будет забрано, или оно не будет поднято... Знающий и получающий знания являются соучастниками в награде, и нет блага в людях после этого».",
                explanation: "Пророк побуждает получать знания до того, как исчезнут обладатели знаний (учёные). Благо есть только среди тех, кто получает знания, и тех, кто обучает."
            },
            {
                id: 3,
                arabic: "عُمَرَ بْنَ الْخَطَابِ رَضِيَ اللَّهُ عَنْهُ يَقُولُ: إِنَّمَا الْأَعْمَالُ بِالنِّيَّةِ: وَإِنَّمَا لِامْرِئٍ مَا نَوَى...",
                russian: "От Умара бин аль-Хаттаба: я слышал, как Пророк сказал: «Поистине, дела оцениваются только по намерению и, поистине, каждому человеку достанется лишь то, что он намеревался обрести...»",
                explanation: "Этот хадис является одним из величайших устоев Ислама. Ни одно поклонение не принимается без искреннего намерения ради Лика Аллаха Всевышнего, а не ради того, чтобы это увидели люди."
            },
            {
                id: 4,
                arabic: "عَنِ ابْنِ عُمَرَ قَالَ: قَالَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ: بُنِيَ الإِسْلَامُ عَلَى خَمْسٍ: شَهَادَةِ أَنْ لَا إِلَهَ إِلَّا اللَّهُ: وَأَنَّ مُحَمَّدًا رَسُولُ اللَّهِ: وَإِقَامِ الصَّلَاةِ: وَإِيتَاءِ الزَّكَاةِ: وَصَوْمِ شَهْرٍ رَمَضَانَ: وَحَجَّ الْبَيْتِ",
                russian: "От Ибн Умара, что Посланник Аллаха сказал: «Ислам основывается на пяти (столпах): свидетельстве о том, что нет бога, кроме Аллаха, и что Мухаммад — посланник Аллаха, совершении молитвы, выплате закята, совершении хаджа и соблюдении поста в рамадане».",
                explanation: "Эти пять столпов образуют основу религиозной практики мусульманина. Оставление молитвы или отрицание обязательности этих столпов выводит человека из ислама."
            },
            {
                id: 5,
                arabic: "عَنْ عَبْدِ اللَّهِ بْنِ عُمَرَ.. قِصَّةُ حَدِيثِ جِبْرِيلَ عَلَيْهِ السَّلَامُ وَسُؤَالِهِ عَنِ الْإِسْلَامِ وَالْإِيمَانِ وَالْإِحْسَانِ",
                russian: "Хадис о приходе ангела Джибриля (мир ему) в человеческом облике к Пророку, когда он спросил об Исламе, Имане (вере), Ихсане (совершенстве в поклонении) и Часе, а в конце Пророк сказал: «Поистине, это Джибриль приходил к вам, дабы научить вас вашему верованию!»",
                explanation: "Этот исчерпывающий хадис охватывает все ступени религии: практические столпы (Ислам), внутренние убеждения (Иман) и поклонение Всевышнему с абсолютной искренностью и трепетом (Ихсан)."
            },
            {
                id: 6,
                arabic: "عَنْ عَبْدِ اللَّهِ بْنِ مَسْعُودٍ قَالَ: حَدَّثَنَا رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ.. إِنَّ خَلْقَ أَحَدِكُمْ يُجْمَعُ فِي بَطْنِ أُمِّهِ أَرْبَعِينَ لَيْلَةً... وَيُكْتَبُ عَمَلَهُ وَأَجَلَهُ وَرِزْقَهُ وَشَقِيٌّ أَمْ سَعِيدٌ",
                russian: "От Абдуллаха бин Мас'уда: «Правдивый и достойный доверия Посланник Аллаха сказал нам: „Поистине, каждый из вас формируется во чреве своей матери сорока ночами... а затем Аллах направляет ангела записать четыре вещи: его дела, его срок, его удел, а также несчастным он будет или счастливым“».",
                explanation: "Основа веры в предопределение (кадар). Всё предопределено Всевышним Аллахом, однако человеку вменено в обязанность совершать благие деяния и просить содействия у Аллаха."
            },
            {
                id: 7,
                arabic: "عَنْ عَلِيِّ بْنِ أَبِي طَالِبٍ رَضِيَ اللَّهُ عَنْهُ قَالَ: كُنَّا فِي جَنَازَةٍ.. فَقَالَ: مَا مِنْكُمْ مِنْ نَفْسٍ مَنْفُوسَةٍ إِلَّا وَقَدْ كُتِبَ مَكَانُهَا مِنَ الْجَنَّةِ وَالنَّارِ.. فَقَالَ: اعْمَلُوا فَكُلُّ مُيَسَّرٌ لِعَمَلِهِ",
                russian: "От Али бин Абу Талиба: когда Пророк рассказал о предопределении судеб, один человек спросил: «О Посланник Аллаха, так не положиться ли нам на то, что уже предопределено, и не отказаться ли от дел?» Пророк ответил: «Вы совершайте деяния, и каждому будет облегчено к его деянию».",
                explanation: "Нельзя оправдывать бездействие предопределением. Человек обязан усердствовать в поклонении, а Всевышний облегчает праведным путь к благому."
            },
            {
                id: 8,
                arabic: "عَنْ عَبْدِ الرَّحْمَنِ بْنِ عَمْرٍو السُّلَمِي وَحُجْرٍ الْكَلَاعِيِّ.. عَنِ الْعِرْبَاضِ بْنِ سَارِيَةَ.. وَعَيْكُمْ بِسُنَّتِي وَسُنَّةِ الْخُلَفَاءِ الرَّاشِدِينَ.. وَإِيَّاكُمْ وَمُحْدَثَاتِ الْأُمُورِ فَإِنَّ كُلَّ بِدْعَةٍ ضَلَالَةٌ",
                russian: "От Абдуррахмана бин Амра и Худжра аль-Каля'и, что аль-Ирбад бин Сарийя передал завещание Пророка: «Я завещаю вам остерегаться наказания Аллаха, слушаться и повиноваться... Вам следует придерживаться моей сунны и сунны праведных халифов... И вам следует отстраняться от новшеств в Исламе, ибо каждое новшество — это нововведение, а каждое нововведение — заблуждение».",
                explanation: "Важнейшее руководство во времена разногласий: держаться Сунны Пророка и пути сподвижников, избегая любых религиозных нововведений (бид'а)."
            },
            {
                id: 9,
                arabic: "عَنِ ابْنِ مَسْعُودٍ عَنْ رَسُولِ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ قَالَ: كَانَ الْكِتَابُ الْأَوَّلُ نَزَلَ مِنْ بَابٍ وَاحِدٍ.. وَنَزَلَ الْقُرْآنُ مِنْ سَبْعَةِ أَبْوَابٍ عَلَى سَبْعَةِ أَحْرُفٍ زَاجِرٍ وَآمِرٍ وَحَلَالٍ وَحَرَامٍ...",
                russian: "От Ибн Мас'уда, что Посланник Аллаха сказал: «А Коран был ниспослан через семь дверей, которые соответствуют семи харфам... Поэтому считайте дозволенным то, что названо дозволенным, и запретным то, что названо запретным...»",
                explanation: "Необходимо следовать установлениям Корана и Сунны, подчиняясь приказам Аллаха и отстраняясь от запретов, изучая Книгу через разъяснения Пророка."
            },
            {
                id: 10,

                explanation: "Праведные деяния, за которые Всевышний дарует великую тень в День Суда."
            },
            {

                arabic: "عَنْ أَبِي ذَرٍّ (في حديثه الطويل الجامع في وصايا النبي صلى الله عليه وسلم له في المسجد، وأسئلته عن أفضل الأعمال، وعدد الأنبياء والرسل والكتب المزلّة...)",
                russian: "Из длинного наставления Пророка Абу Зарру в мечети: о наилучших деяниях (вера и джихад), лучшем нраве, молитве, посте, аятах Аль-Курси, количестве пророков и ниспосланных книгах. В конце Пророк сказал: «О Абу Зарр, нет разума подобного размышлению, нет воздержания подобного оставлению запретного, и нет чести подобной благому нраву!»",
                explanation: "Великолепное завершение сборника Имама аль-Аджурри, охватывающее важнейшие основы духовного воспитания, вероучения и мудрости."

        ];

        let currentIndex = 0;
        let bookmarks = JSON.parse(localStorage.getItem('ajurri_bookmarks') || '[]');

        // Функция для отсечения иснада (берет только текст внутри кавычек «...»)
        function extractCoreText(text) {
            const match = text.match(/«(.*?)»/);
            return match ? match[1] : text;
        }

        function updateView() {
            const current = hadiths[currentIndex];
            
            document.getElementById('hadith-num').innerText = current.id;
            document.getElementById('counter').innerText = `${currentIndex + 1} / 40`;
            document.getElementById('arabic-text').innerText = current.arabic;
            document.getElementById('russian-text').innerText = current.russian;
            document.getElementById('explanation-text').innerText = current.explanation;

            document.getElementById('prev-btn').disabled = currentIndex === 0;
            document.getElementById('next-btn').disabled = currentIndex === hadiths.length - 1;
            
            if(currentIndex === hadiths.length - 1) {
                document.getElementById('next-btn').innerHTML = `<span>Конец</span>`;
            } else {
                document.getElementById('next-btn').innerHTML = `<span>Вперед</span><svg class="w-4 h-4 ml-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>`;
            }

            updateBookmarkIcon();
            
            const sidebar = document.getElementById('sidebar');
            if (!sidebar.classList.contains('hidden')) {
                toggleSidebar();
            }
        }

        function nextHadith() {
            if (currentIndex < hadiths.length - 1) {
                currentIndex++;
                updateView();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        }

        function prevHadith() {
            if (currentIndex > 0) {
                currentIndex--;
                updateView();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        }

        function goToHadith(index) {
            currentIndex = index;
            updateView();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function renderSidebarList(filterText = '') {
            const container = document.getElementById('hadiths-list-container');
            container.innerHTML = '';
            
            const filtered = hadiths.filter(h => {
                const matchNum = h.id.toString().includes(filterText);
                const matchRu = h.russian.toLowerCase().includes(filterText.toLowerCase());
                const matchExp = h.explanation.toLowerCase().includes(filterText.toLowerCase());
                return matchNum || matchRu || matchExp;
            });

            if (filtered.length === 0) {
                container.innerHTML = `<div class="p-6 text-center text-sm text-slate-400">Ничего не найдено</div>`;
                return;
            }

            filtered.forEach(h => {
                const originalIndex = hadiths.findIndex(item => item.id === h.id);
                const isCurrent = originalIndex === currentIndex;
                const isBookmarked = bookmarks.includes(h.id);
                
                // Используем функцию отсечения иснада для предпросмотра
                const previewText = extractCoreText(h.russian);

                const item = document.createElement('div');
                item.className = `p-3.5 hover:bg-slate-50 cursor-pointer flex items-center justify-between transition ${isCurrent ? 'bg-amber-50/50 border-l-4 border-[#c0a16b]' : ''}`;
                item.onclick = () => goToHadith(originalIndex);
                
                item.innerHTML = `
                    <div class="flex items-center space-x-3 overflow-hidden pr-2">
                        <span class="w-8 h-8 rounded-full gold-badge flex items-center justify-center text-xs font-bold shrink-0">${h.id}</span>
                        <p class="text-xs text-slate-700 line-clamp-2 leading-relaxed">${previewText}</p>
                    </div>
                    ${isBookmarked ? '<svg class="w-5 h-5 text-amber-500 shrink-0" fill="currentColor" viewBox="0 0 24 24"><path d="M5 5a2 2 0 012-2h10a2 2 0 012 2v16l-7-3.5L5 21V5z"/></svg>' : ''}
                `;
                container.appendChild(item);
            });
        }

        function filterHadiths(val) {
            renderSidebarList(val);
        }

        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const content = document.getElementById('sidebar-content');
            
            if (sidebar.classList.contains('hidden')) {
                sidebar.classList.remove('hidden', 'pointer-events-none');
                setTimeout(() => {
                    sidebar.classList.remove('opacity-0');
                    content.classList.remove('-translate-x-full');
                }, 10);
                renderSidebarList();
            } else {
                sidebar.classList.add('opacity-0');
                content.classList.add('-translate-x-full');
                setTimeout(() => {
                    sidebar.classList.add('hidden', 'pointer-events-none');
                }, 300);
            }
        }

        function toggleBookmarkCurrent() {
            const currentId = hadiths[currentIndex].id;
            const idx = bookmarks.indexOf(currentId);
            if (idx > -1) {
                bookmarks.splice(idx, 1);
                showToast('Хадис удален из избранного');
            } else {
                bookmarks.push(currentId);
                showToast('Хадис добавлен в избранное');
            }
            localStorage.setItem('ajurri_bookmarks', JSON.stringify(bookmarks));
            updateBookmarkIcon();
        }

        function updateBookmarkIcon() {
            const currentId = hadiths[currentIndex].id;
            const isBookmarked = bookmarks.includes(currentId);
            const icon = document.getElementById('bookmark-icon');
            const btn = document.getElementById('bookmark-btn');
            
            if (isBookmarked) {
                icon.setAttribute('fill', 'currentColor');
                btn.classList.add('text-amber-500');
            } else {
                icon.setAttribute('fill', 'none');
                btn.classList.remove('text-amber-500');
            }
        }

        function toggleBookmarksList() {
            const modal = document.getElementById('bookmarks-modal');
            const container = document.getElementById('bookmarks-container');
            
            if (modal.classList.contains('hidden')) {
                container.innerHTML = '';
                if (bookmarks.length === 0) {
                    container.innerHTML = `<div class="p-8 text-center text-sm text-slate-400">У вас пока нет сохраненных хадисов</div>`;
                } else {
                    bookmarks.sort((a,b) => a - b).forEach(id => {
                        const h = hadiths.find(item => item.id === id);
                        if (!h) return;
                        const originalIndex = hadiths.findIndex(item => item.id === id);
                        const previewText = extractCoreText(h.russian);
                        
                        const div = document.createElement('div');
                        div.className = 'p-3 rounded-xl border border-slate-100 hover:bg-slate-50 cursor-pointer flex justify-between items-center transition';
                        div.onclick = () => {
                            goToHadith(originalIndex);
                            toggleBookmarksList();
                        };
                        div.innerHTML = `
                            <div class="pr-2">
                                <span class="text-[10px] font-bold text-white bg-[#c0a16b] px-2 py-0.5 rounded">Хадис № ${h.id}</span>
                                <p class="text-xs text-slate-700 mt-1.5 line-clamp-1 font-medium">${previewText}</p>
                            </div>
                            <svg class="w-4 h-4 text-slate-400 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
                        `;
                        container.appendChild(div);
                    });
                }
                modal.classList.remove('hidden');
                modal.classList.add('flex');
            } else {
                modal.classList.add('hidden');
                modal.classList.remove('flex');
            }
        }

        function copyArabic() { fallbackCopy(hadiths[currentIndex].arabic); }
        function copyRussian() { 
            const h = hadiths[currentIndex];
            fallbackCopy(`Хадис №${h.id}\n\n${h.russian}\n\nРазъяснение: ${h.explanation}`);
        }

        function fallbackCopy(text) {
            const textArea = document.createElement("textarea");
            textArea.value = text;
            textArea.style.position = "fixed"; 
            document.body.appendChild(textArea);
            textArea.focus();
            textArea.select();
            try {
                document.execCommand('copy');
                showToast('Скопировано в буфер');
            } catch (err) {
                showToast('Ошибка копирования');
            }
            document.body.removeChild(textArea);
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.innerText = msg;
            toast.classList.remove('opacity-0', 'pointer-events-none');
            setTimeout(() => toast.classList.add('opacity-0', 'pointer-events-none'), 2000);
        }

        // Свайпы
        let touchstartX = 0;
        let touchendX = 0;
        document.addEventListener('touchstart', e => touchstartX = e.changedTouches[0].screenX);
        document.addEventListener('touchend', e => {
            touchendX = e.changedTouches[0].screenX;
            if (touchendX < touchstartX - 70) nextHadith();
            if (touchendX > touchstartX + 70) prevHadith();
        });

        // Клавиатура
        document.addEventListener('keydown', e => {
            if (e.key === 'ArrowRight') prevHadith();
            if (e.key === 'ArrowLeft') nextHadith();
        });

        updateView();
    </script>
</body>
</html>
